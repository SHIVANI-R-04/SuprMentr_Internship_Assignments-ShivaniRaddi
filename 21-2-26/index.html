<!DOCTYPE html>
<html>
<head>
  <title>Responsive Hero Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f4f4;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 60px 10%;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .hero-text {
      flex: 1;
    }

    .hero-text h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .hero-text p {
      font-size: 18px;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    .hero-text button {
      padding: 12px 25px;
      border: none;
      background: white;
      color: #764ba2;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    .hero-text button:hover {
      background: #ddd;
    }

    .hero-image {
      flex: 1;
      text-align: center;
    }

    .hero-image img {
      max-width: 100%;
      height: auto;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .hero {
        flex-direction: column;
        text-align: center;
      }

      .hero-text h1 {
        font-size: 32px;
      }

      .hero-text {
        margin-bottom: 30px;
      }
    }
  </style>
</head>

<body>

  <section class="hero">
    <div class="hero-text">
      <h1>Build Your Future with Web Development</h1>
      <p>
        Learn modern HTML, CSS, and JavaScript to create responsive and professional websites.
        Start your journey today and become a full-stack developer.
      </p>
      <button>Get Started</button>
    </div>

    <div class="hero-image">
      <<img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085" alt="Coding Image">
    </div>
  </section>

</body>
</html>
